# ===== アフィリエイト設定（アフィリエイト用チャンネル） =====
# 動画の内容に合う「テーマ」を自動で選び、
#   1) YouTube の説明欄に商品リンク（＋広告表記）を入れる
#   2) まとめページ（GitHub Pages）にテーマごとの商品一覧を載せる
# という仕組みです。README の「アフィリエイトで稼ぐ」も見てください。

enabled: true

# --- あなたのID（ここに書くか、GitHub の Variables に登録） ---
# 環境変数 AMAZON_ASSOCIATE_TAG / RAKUTEN_AFFILIATE_ID があればそちらを優先します。
# 空のままだと、そのショップのリンクは作られません。
amazon_tag: ""          # 例: yourname-22
rakuten_id: "59cb71ca.54063a36.59cb71cb.fc6d2c32"

# --- まとめページのURL ---
# 空なら GitHub Actions 上では https://<ユーザー名>.github.io/<リポジトリ名>/ を自動で使います。
# 独自ドメインや別サービス（lit.link など）を使うならここに書く。
site_url: ""
site_title: 動画で紹介したアイテムまとめ

# --- おすすめ商品の自動選択（楽天の商品検索API） ---
# Secrets に RAKUTEN_APP_ID / RAKUTEN_ACCESS_KEY があると、search: の商品を
# 「レビューが多くて評価の高い具体的な商品」に自動で置き換えます（リンクはあなたのアフィリエイトリンク）。
# まとめページは毎日作り直されるので、おすすめも毎日最新の人気商品になります。
auto_pick: true
# 下のテーマに当てはまらない動画は、動画のタグから自動でテーマを作って商品を探す
#   → topics.yaml にネタを書き足すだけで、合う商品が自動で選ばれる
auto_theme: true
min_reviews: 50          # これよりレビューが少ない商品は選ばない（レビュー50件以上は売れやすいと言われる）
min_review_average: 4.0  # これより評価が低い商品は選ばない

# 説明欄に載せる商品の数（多すぎるとスパム扱いされやすいので 2〜3 推奨）
max_items_in_description: 3

# 動画の最後のナレーションに一言足す（ショートは説明欄のリンクが押せないため）
#   空にすると何も足しません
outro_cta: 紹介アイテムはプロフィールのリンクから！

# --- テーマ一覧 ---
# keywords のどれかが動画のタイトル・タグ・台本に入っていると、そのテーマが選ばれます。
# どれにも当てはまらないときは default: true のテーマを使います。
#
# 商品の書き方:
#   search: 検索キーワード   → Amazon / 楽天の検索結果へのアフィリエイトリンクを自動で作る（手軽）
#   url:    リンクURL        → 自分で作った商品リンクをそのまま使う（成約率が高い・おすすめ）
#   rakuten_url: 楽天のページURL → 楽天の好きなページ（特集ページなど）を自動でアフィリエイトリンクにする
#   どちらか片方、または両方を書けます。
#   search: の商品は、API キーがあれば人気商品に自動で置き換わります（auto_pick: false で個別に止められる）
