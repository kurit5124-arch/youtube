    - text: 渋みのもとはカテキン
      narration: お茶の渋みのもとは、カテキンという成分です。
    - text: 新茶は八十八夜のころ
      narration: その年最初に摘まれる新茶は、立春から88日目、八十八夜のころが目安とされています。
  tags: [お茶, 雑学, 飲み物, shorts]

- title: チョコレートの雑学
  hook: 大好きなチョコレート、どこまで知ってる？
  hook_text: "チョコの\n雑学"
  points:
    - text: 原料はカカオの実の種
      narration: チョコレートの原料のカカオ豆は、カカオの実の中にある種です。
    - text: 犬や猫には危険
      narration: チョコレートに含まれる成分は、犬や猫には毒になるので、絶対にあげてはいけません。
    - text: ホワイトチョコが白い理由
      narration: ホワイトチョコは、茶色いカカオマスを使わず、カカオバターで作るので白いんです。
  tags: [チョコレート, 雑学, お菓子, shorts]

- title: お風呂の得する雑学
  hook: いつものお風呂が、もっと気持ちよくなる雑学です。
  hook_text: "お風呂の\n得する雑学"
  points:
    - text: リラックスはぬるめのお湯
      narration: 38度から40度くらいのぬるめのお湯のほうが、体がリラックスしやすいと言われています。
    - text: 寝る1〜2時間前がおすすめ
      narration: 寝る1、2時間前にお風呂に入ると、寝つきがよくなりやすいと言われています。
    - text: 冬は温度差に注意
      narration: 冬は脱衣所とお風呂の温度差で体に負担がかかるので、脱衣所を暖めておくと安心です。
  tags: [お風呂, 入浴, 雑学, shorts]

- title: 冬の乾燥対策の雑学
  hook: 冬の乾燥、ちゃんと対策できてる？
  hook_text: "冬の\n乾燥対策"
  points:
    - text: 湿度は40〜60%が目安
      narration: 部屋の湿度は、40パーセントから60パーセントくらいが快適な目安とされています。
    - text: 乾燥はのどの大敵
      narration: 空気が乾燥すると、のどや鼻の粘膜も乾いて、かぜをひきやすくなると言われています。
    - text: 部屋干しでも加湿できる
      narration: 洗濯物を部屋に干すだけでも、部屋の加湿になります。
  tags: [加湿, 乾燥, 冬, 雑学, shorts]
  months: [11, 12, 1, 2, 3]

- title: 筋トレの雑学
  hook: 筋トレを始める前に知っておきたい雑学です。
  hook_text: "筋トレの\n雑学"
  points:
    - text: 筋肉は休んでいる間に育つ
      narration: 筋肉は、トレーニングのあと休んでいる間に回復して、強くなると言われています。
    - text: 太ももは大きな筋肉
      narration: 太ももの筋肉は体の中でも大きく、鍛えると効率よく体を動かせます。
    - text: スクワットは道具いらず
      narration: スクワットは道具がなくても、家ですぐにできる筋トレです。
  tags: [筋トレ, 運動, 雑学, shorts]

- title: 水の大切な雑学
  hook: 毎日飲んでいる水、実はすごく大事なんです。
  hook_text: "水の\n大切な雑学"
  points:
    - text: 体の約60%は水
      narration: 大人の体の、およそ60パーセントは水でできています。
    - text: のどが渇く前に飲む
      narration: のどが渇いたと感じる前に、こまめに水を飲むのがよいとされています。
    - text: 寝ている間も水分は減る
      narration: 寝ている間にも汗などで水分が失われるので、起きたら一杯の水がおすすめです。
  tags: [水分補給, 雑学, 健康, shorts]

- title: 歯みがきの雑学
  hook: 毎日の歯みがき、もっと上手になる雑学です。
  hook_text: "歯みがきの\n雑学"
  points:
    - text: 歯ブラシは1か月で交換
      narration: 歯ブラシは毛先が開くと汚れが落ちにくいので、1か月くらいでの交換が目安です。
    - text: 歯の間はフロスで
      narration: 歯ブラシだけでは歯の間の汚れは落ちにくいので、フロスや歯間ブラシを使うと効果的です。
    - text: 寝る前の歯みがきが大事
      narration: 寝ている間は口の中を守るだ液が減るので、寝る前の歯みがきが特に大切です。
  tags: [歯みがき, 歯ブラシ, 雑学, shorts]

- title: 目の疲れをとる雑学
  hook: スマホやパソコンで目が疲れている人へ。
  hook_text: "目の疲れを\nとる雑学"
  points:
    - text: 20分ごとに遠くを見る
      narration: 20分ごとに、遠くを20秒ほど見ると、目の疲れがやわらぐと言われています。
    - text: 画面を見るとまばたきが減る
      narration: 画面に集中するとまばたきが減って、目が乾きやすくなります。
    - text: 目を温めるとリラックス
      narration: 蒸しタオルなどで目を温めると、目のまわりがほぐれてリラックスできます。
  tags: [目の疲れ, 雑学, 健康, shorts]

- title: 卵の雑学
  hook: 毎日食べる卵の、意外な雑学です。
  hook_text: "卵の\n雑学"
  points:
    - text: 殻の色で栄養はほぼ同じ
      narration: 赤い卵と白い卵の違いはニワトリの種類によるもので、栄養はほとんど変わりません。
    - text: とがった方を下にして保存
      narration: 卵は、とがった方を下にして保存すると、長持ちしやすいと言われています。
    - text: 黄身の色はエサで変わる
      narration: 黄身の色の濃さは、ニワトリが食べるエサによって変わります。
  tags: [卵, 料理, 雑学, shorts]

- title: お米の雑学
  hook: 日本人の主食、お米の雑学です。
  hook_text: "お米の\n雑学"
  points:
    - text: 一番多い品種はコシヒカリ
      narration: 日本で一番多く作られているお米の品種は、コシヒカリです。
    - text: お米は涼しい場所で保存
      narration: お米は暑さや湿気に弱いので、冷蔵庫の野菜室などで保存するとおいしさが長持ちします。
    - text: 精米したら早めに食べる
      narration: 精米したお米は少しずつ味が落ちていくので、早めに食べるのがおすすめです。
  tags: [お米, 料理, 雑学, shorts]

- title: 発酵食品の雑学
  hook: 日本は発酵食品の国。身近な発酵食品の雑学です。
  hook_text: "発酵食品の\n雑学"
  points:
    - text: 身近な発酵食品
      narration: 納豆、味噌、しょうゆ、ヨーグルトは、どれも発酵食品です。
    - text: 味噌もしょうゆも大豆から
      narration: 味噌もしょうゆも、主な原料は大豆です。
    - text: 納豆は混ぜるほど糸が増える
      narration: 納豆は、よく混ぜるほど糸が増えて、ふんわりした食感になります。
  tags: [発酵食品, 納豆, 雑学, shorts]

- title: 掃除がラクになる雑学
  hook: 掃除がちょっとラクになる雑学です。
  hook_text: "掃除が\nラクになる"
  points:
    - text: 掃除は上から下へ
      narration: ほこりは上から下に落ちるので、掃除は高い所から始めるのが効率的です。
    - text: 窓ふきはくもりの日
      narration: 窓ふきは、晴れの日よりくもりの日のほうが、ふきムラが残りにくいと言われています。
    - text: 油汚れには重曹
      narration: 重曹は、キッチンの油汚れを落とすのに役立ちます。
  tags: [掃除, 家事, 雑学, shorts]

- title: 洗濯の雑学
  hook: 毎日の洗濯に役立つ雑学です。
  hook_text: "洗濯の\n雑学"
  points:
    - text: 洗濯表示は2016年に変わった
      narration: 服についている洗濯表示のマークは、2016年に国際的な記号に変わりました。
    - text: 部屋干しのにおいの原因
      narration: 部屋干しのいやなにおいは、乾くのに時間がかかって菌が増えることが主な原因です。
    - text: 洗剤は入れすぎない
      narration: 洗剤は多く入れても汚れ落ちはよくならず、すすぎ残りの原因になります。
  tags: [洗濯, 家事, 雑学, shorts]

- title: 観葉植物を枯らさない雑学
  hook: 観葉植物を枯らしてしまう人に知ってほしい雑学です。
  hook_text: "観葉植物を\n枯らさない"
  points:
    - text: 水のやりすぎに注意
      narration: 観葉植物が枯れる原因で多いのが、水のやりすぎによる根ぐされです。
    - text: 冬は水やりを減らす
      narration: 冬は植物の成長がゆっくりになるので、水やりの回数を減らします。
    - text: レースカーテン越しの光
      narration: 多くの観葉植物は、強い直射日光より、レースカーテン越しのやわらかい光を好みます。
  tags: [観葉植物, 植物, 雑学, shorts]

- title: ハムスターの雑学
  hook: かわいいハムスターの、意外な雑学です。
  hook_text: "ハムスターの\n雑学"
  points:
    - text: ほおぶくろに食べ物をためる
      narration: ハムスターは、ほおぶくろに食べ物をためて、巣に持ち帰ります。
    - text: 夜に活動する
      narration: ハムスターは夜行性で、夜になると元気に動き回ります。
    - text: 歯は一生伸び続ける
      narration: ハムスターの前歯は一生伸び続けるので、かじって削る必要があります。
  tags: [ハムスター, 動物, 雑学, shorts]

- title: うさぎの雑学
  hook: うさぎ好きに知ってほしい雑学です。
  hook_text: "うさぎの\n雑学"
  points:
    - text: 歯が一生伸びる
      narration: うさぎの歯は一生伸び続けるので、かたい物をかじって削っています。
    - text: 主食は牧草
      narration: うさぎの主食は、にんじんではなく牧草です。
    - text: 長い耳で体温調節
      narration: うさぎは長い耳から熱を逃がして、体温を調節していると言われています。
  tags: [うさぎ, 動物, 雑学, shorts]

- title: 本と読書の雑学
  hook: 本好きなら知っておきたい雑学です。
  hook_text: "読書の\n雑学"
  points:
    - text: 「積ん読」は英語にもなった
      narration: 買った本を読まずに積んでおく「積ん読」は、英語でもツンドクとして紹介されています。
    - text: 新刊は年に数万点
      narration: 日本では、1年に数万点もの新しい本が出版されています。
    - text: 寝る前の読書でリラックス
      narration: 寝る前にスマホではなく本を読むと、リラックスしやすいと言われています。
  tags: [読書, 本, 雑学, shorts]

- title: 鉛筆の雑学
  hook: 誰もが使ったことのある鉛筆の雑学です。
  hook_text: "鉛筆の\n雑学"
  points:
    - text: HとBの意味
      narration: 鉛筆のHはハード、かたい。Bはブラック、黒いという意味です。
    - text: 芯は黒鉛と粘土
      narration: 鉛筆の芯は、黒鉛と粘土を混ぜて焼いて作られています。
    - text: 鉛は入っていない
      narration: 名前に鉛とついていますが、鉛筆の芯に鉛は入っていません。
  tags: [鉛筆, 文房具, 雑学, shorts]

- title: スマホを長持ちさせる雑学
  hook: スマホを長く使いたい人へ。
  hook_text: "スマホを\n長持ちさせる"
  points:
    - text: 電池は暑さに弱い
      narration: スマホの電池は高い温度に弱いので、夏の車の中などに置きっぱなしにしないようにしましょう。
    - text: 0%まで使い切らない
      narration: 電池は、0パーセントまで使い切る前に充電したほうが、負担が少ないと言われています。
    - text: 画面はやわらかい布で
      narration: 画面の汚れは、メガネふきのようなやわらかい布でふくと、傷がつきにくいです。
  tags: [スマホ, 雑学, 便利, shorts]

- title: こたつの雑学
  hook: 冬の主役、こたつの雑学です。
  hook_text: "こたつの\n雑学"
  points:
    - text: ルーツはいろり
      narration: こたつのルーツは、室町時代ごろのいろりだと言われています。
    - text: 電気こたつは戦後に広まった
      narration: 電気こたつが家庭に広まったのは、戦後になってからです。
    - text: こたつで寝るのは要注意
      narration: こたつで寝てしまうと、体が温まりすぎて眠りが浅くなったり、汗で水分が減ったりします。
  tags: [こたつ, 冬, 雑学, shorts]
  months: [11, 12, 1, 2]

- title: 鍋料理の雑学
  hook: 寒い日に食べたい、鍋の雑学です。
  hook_text: "鍋の\n雑学"
  points:
    - text: 土鍋は冷めにくい
      narration: 土鍋は熱をたくわえる力が強いので、料理が冷めにくいんです。
    - text: 新しい土鍋は目止めを
      narration: 新しい土鍋は、最初におかゆを炊く「目止め」をすると、ひび割れしにくくなります。
    - text: しめまでおいしい
      narration: 鍋のしめの雑炊やうどんは、具材のうまみがたっぷりのスープを最後まで楽しめます。
  tags: [鍋, 土鍋, 冬, 雑学, shorts]
  months: [11, 12, 1, 2]

- title: クリスマスの雑学
  hook: もうすぐクリスマス。意外と知らない雑学です。
  hook_text: "クリスマスの\n雑学"
  points:
    - text: ツリーのもみの木の意味
      narration: もみの木は冬でも緑の葉を保つので、永遠の命の象徴とされてきました。
    - text: ポインセチアの赤は葉っぱ
      narration: クリスマスの花ポインセチアの赤い部分は、花ではなく葉っぱの仲間です。
    - text: ケーキを食べるのは日本流
      narration: クリスマスにデコレーションケーキを食べる習慣は、日本で広まったものだと言われています。
  tags: [クリスマス, 冬, 雑学, shorts]
  months: [12]
  dates: ["12-20", "12-24"]

- title: お正月の雑学
  hook: お正月の行事、意味を知るともっと楽しくなります。
  hook_text: "お正月の\n雑学"
  points:
    - text: 鏡もちは神様へのお供え
      narration: 鏡もちは、新しい年の神様、年神様へのお供えものです。
    - text: 鏡開きは1月11日
      narration: 鏡もちを下げて食べる鏡開きは、多くの地域で1月11日に行われます。
    - text: 黒豆は「まめに」働く
      narration: おせち料理の黒豆には、まめに働けますように、という願いがこめられています。
  tags: [お正月, おせち, 雑学, shorts]
  months: [12, 1]
  dates: ["12-28", "01-01"]

- title: はちみつの雑学
  hook: 甘くておいしい、はちみつの雑学です。
  hook_text: "はちみつの\n雑学"
  points:
    - text: 1歳未満の赤ちゃんはNG
      narration: はちみつは、1歳未満の赤ちゃんには食べさせてはいけません。
    - text: はちみつは腐りにくい
      narration: はちみつは糖分がとても多いので、腐りにくい食べ物です。
    - text: 白く固まっても大丈夫
      narration: はちみつが白く固まるのは結晶になっただけで、品質には問題ありません。
  tags: [はちみつ, 食べ物, 雑学, shorts]

- title: ウォーキングの雑学
  hook: 手軽に始められる、ウォーキングの雑学です。
  hook_text: "ウォーキングの\n雑学"
  points:
    - text: 歩くと気分転換になる
      narration: 外を歩くと、気分がすっきりして気分転換になると言われています。
    - text: 靴選びが大事
      narration: 長く歩くなら、足に合ったクッション性のある靴を選ぶと疲れにくいです。
    - text: 階段も手軽な運動
      narration: エレベーターの代わりに階段を使うだけでも、手軽な運動になります。
  tags: [ウォーキング, 運動, 雑学, shorts]
