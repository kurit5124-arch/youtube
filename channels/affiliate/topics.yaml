# アフィリエイト用チャンネルのネタ帳（日替わりで使われます）
# 書き方はリポジトリ直下の topics.yaml と同じ。
# コツ: affiliate.yaml の各テーマの keywords がタイトルや tags に入るネタにすると、
#       そのテーマの商品リンクが説明欄に自動で入ります。

- title: ふるさと納税の知らないと損する話
  hook: ふるさと納税、まだの人は要注意。知らないと損する話を3つ紹介します。
  hook_text: "ふるさと納税\n知らないと損"
  points:
    - text: 年内の寄付は12月31日まで
      narration: その年の控除に使えるのは、12月31日までの寄付分です。年末は混むので早めがおすすめです。
    - text: 自己負担は2000円
      narration: 上限額の範囲内なら、寄付額から2000円を引いた分が、税金から差し引かれます。
    - text: 上限額は人によって違う
      narration: 控除される上限額は、年収や家族構成で変わります。寄付する前に一度確認しておきましょう。
  tags: [ふるさと納税, 雑学, 節約, お金, shorts]

- title: 猫の意外な雑学
  hook: 猫好きでも意外と知らない、猫の雑学を3つ紹介します。
  hook_text: "猫好きも\n知らない雑学"
  points:
    - text: 猫は1日の大半を寝て過ごす
      narration: 猫は1日に12時間から16時間も眠ると言われています。
    - text: 猫の鼻の模様は一匹ずつ違う
      narration: 猫の鼻のしわの模様は、人間の指紋のように一匹ずつ違うそうです。
    - text: 猫は甘みを感じにくい
      narration: 猫は甘みを感じる仕組みがうまく働かず、甘さをほとんど感じないと言われています。
  tags: [猫, 雑学, 動物, shorts]

- title: 睡眠のちょっと得する雑学
  hook: 今日からぐっすり眠れるかも。睡眠の雑学を3つ紹介します。
  hook_text: "睡眠の\n得する雑学"
  points:
    - text: 人生の約3分の1は睡眠
      narration: 1日7、8時間寝るとすると、人は人生のおよそ3分の1を眠って過ごしています。
    - text: 寝る前のスマホは眠りの敵
      narration: スマホの強い光は、眠りを促すホルモンの働きを弱め、寝つきを悪くすると言われています。
    - text: 昼寝は30分以内がコツ
      narration: 昼寝は30分以内にすると、深く眠りすぎず、午後をすっきり過ごしやすくなります。
  tags: [睡眠, 雑学, 健康, shorts]

- title: 宇宙のびっくり雑学
  hook: 知ると夜空の見え方が変わる、宇宙の雑学です。
  hook_text: "宇宙の\nびっくり雑学"
  points:
    - text: 金星の1日は1年より長い
      narration: 金星は自転がとても遅く、1日の長さが1年よりも長いんです。
    - text: 宇宙は無音の世界
      narration: 宇宙には音を伝える空気がないので、爆発が起きても音は聞こえません。
    - text: 夜空の星の光は過去の光
      narration: 今見ている星の光は、何年も、何千年も前にその星を出発した光です。
  tags: [宇宙, 雑学, 天文, shorts]

- title: コーヒーの意外な雑学
  hook: 毎日飲んでいても意外と知らない、コーヒーの雑学です。
  hook_text: "コーヒーの\n意外な雑学"
  points:
    - text: コーヒー豆は「豆」じゃない
      narration: コーヒー豆は、実はコーヒーノキという植物の果実の種なんです。
    - text: 生産量世界一はブラジル
      narration: コーヒーの生産量が世界で一番多い国は、ブラジルです。
    - text: もとは赤い実
      narration: コーヒーの実は熟すと赤くなり、さくらんぼに似ていることからコーヒーチェリーと呼ばれます。
  tags: [コーヒー, 雑学, 飲み物, shorts]

- title: 犬のすごい雑学
  hook: 犬好きなら知っておきたい、犬の雑学を3つ紹介します。
  hook_text: "犬の\nすごい雑学"
  points:
    - text: 犬の鼻紋は一頭ずつ違う
      narration: 犬の鼻の表面の模様は、人間の指紋のように一頭ずつ違います。
    - text: 汗をかくのは主に肉球
      narration: 犬は体のほとんどで汗をかかず、汗をかくのは主に肉球です。
    - text: 鼻は人間よりはるかに鋭い
      narration: 犬の嗅覚は、人間の数千倍以上とも言われるほど鋭いんです。
  tags: [犬, 雑学, 動物, shorts]

- title: 日本語のふしぎ
  hook: 普段使っている日本語にも、意外なルーツがあります。
  hook_text: "日本語の\nふしぎ"
  points:
    - text: 「ありがとう」の語源は「有り難し」
      narration: ありがとうの語源は、めったにない、という意味の「有り難し」だと言われています。
    - text: 「いただきます」は命への感謝
      narration: いただきますには、食材の命をいただくという感謝の意味が込められています。
    - text: 「やばい」は江戸時代からある言葉
      narration: 若者言葉に思えるやばいは、江戸時代には既に使われていたと言われています。
  tags: [日本語, 雑学, 語源, shorts]
