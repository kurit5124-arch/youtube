- title: ふるさと納税の知らないと損する話
  hook: ふるさと納税、まだの人は要注意。知らないと損する話を3つ紹介します。
  hook_text: "ふるさと納税\n知らないと損"
  points:
    - text: 年内の寄付は12月31日まで
      narration: その年の控除に使えるのは、12月31日までの寄付分です。年末は混むので早めがおすすめです。
    - text: 自己負担は2000円
      narration: 上限額の範囲内なら、寄付額から2000円を引いた分が、税金から差し引かれます。
    - text: 上限額は人によって違う
      narration: 控除される上限額は、年収や家族構成で変わります。寄付する前に一度確認しておきましょう。
  tags: [ふるさと納税, 雑学, 節約, お金, shorts]
  dates: ["12-01", "12-15", "12-26"]   # 年末の締め切り前に念押し

- title: 猫の意外な雑学
