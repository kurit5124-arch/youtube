# みんなの裁判：手持ちの事件
# ANTHROPIC_API_KEY が無いとき（または --stock のとき）に、上から順番に使われます。
# 使った事件は saiban/history.json に記録され、二度と使われません。
#
# 文字数の目安（1分以内に収めるため）
#   hook 40 / summary 40 / summary_narration 90 / *_claim 35 / *_narration 70
#   question 30 / option_a・option_b 9 文字以内
#   hints: note の記事に載せる「考えるヒント」（3つ。動画には出ません）
# すべてフィクションです。実在の人物・団体・事件は書かないでください。

- title: AI小説の賞金事件
  category: AI・テクノロジー
  hook: AIで書いた小説が、まさかの大賞。その賞金、もらっていい？
  summary: AIに9割書かせた小説が文学賞の大賞に
  summary_narration: ある会社員が、AIに9割を書かせた小説を文学賞に応募し、大賞を受賞。賞金は100万円。ところが、あとからAIを使ったことが分かりました。
  plaintiff_claim: AIが書いた作品に賞金を払う理由はない
  plaintiff_narration: 主催者側です。応募規約にAI禁止とは書いていないが、自分で書いたと思っていた。賞金を返してほしい、と主張。
  defendant_claim: 規約は守った。AIも道具の一つだ
  defendant_narration: 規約に違反はしていない。構成もアイデアも自分が考えた。AIはワープロと同じ道具だ、と反論しています。
  question: 賞金を返すべき？
  option_a: 返すべき
  option_b: 返さなくていい
  tags: [AI, 小説, 文学賞]
  hints:
    - title: 「書いた」とはどこまでを言う？
      text: 構成やアイデアを人が考え、文章をAIが書いた場合、作者は誰なのか。ワープロや辞書と、文章そのものを作るAIは同じ「道具」と言えるでしょうか。
    - title: 書いていないルールは守る必要がある？
      text: 規約にAI禁止とは書かれていませんでした。書かれていないことを後から問題にするのは公平か。それとも「言わなくても分かるはず」の常識はあるのか。
    - title: 黙っていたことは問題？
      text: AIを使ったことを応募時に伝えていたら、結果は変わったかもしれません。ルール違反ではなくても、伝えなかったこと自体をどう考えるかで判断が分かれます。

- title: 寝言でお肉ポチった事件
  category: 家族
  hook: 夫の寝言をAIスピーカーが聞いて、まさかの高級和牛を注文。払うのは誰？
  summary: 夫の寝言でAIスピーカーが和牛3万円を注文
  summary_narration: 夜中、夫が寝言で、A5ランクの和牛を3キロ、とつぶやきました。それを聞いたAIスピーカーが、本当に3万円の和牛を注文。翌朝、玄関に届いて大騒ぎです。
  plaintiff_claim: 寝言でも言ったのはあなた。お小遣いから払って
  plaintiff_narration: 妻です。言ったのは夫本人。しかも夢の中で一人で食べていたらしい。3万円は夫のお小遣いから払うべきだ、と主張。
  defendant_claim: 寝ている間の発言に責任は持てない
  defendant_narration: 夫です。寝言は自分の意思じゃない。音声で注文できる設定にしたのは妻だし、和牛は家族みんなで食べた、と反論。
  question: 夫がお小遣いで払うべき？
  option_a: 夫が払うべき
  option_b: 家計で払う
  tags: [AIスピーカー, 寝言, 夫婦, 和牛, 家族]
  hints:
    - title: 寝言は「本人の発言」？
      text: 声を出したのは確かに夫。でも本人に注文するつもりはありませんでした。意思のない発言にまで責任を持つべきかどうかが、最初の分かれ目です。
    - title: 音声注文をオンにした人の責任
      text: 確認なしで買える設定にしていなければ、注文は起きませんでした。便利な設定を選んだ人も、ある程度のリスクを引き受けたと言えるかもしれません。
    - title: 食べてしまった後の話
      text: 和牛は家族みんなでおいしく食べました。得をした人がいるなら、費用もみんなで分けるべき？それとも、きっかけを作った人が払うべき？

- title: 推しのチケット代金事件
  category: 推し活
  hook: 親友に頼まれて取ったライブのチケット。その親友がまさかの…
  summary: 代わりに取ったチケットを親友が前日ドタキャン
  summary_narration: 人気アイドルのライブ。親友に頼まれてチケットを2枚取ったのに、親友は前日に、行けなくなったからお金は払わない、と言い出しました。
  plaintiff_claim: 頼まれて取ったんだから代金は払って
  plaintiff_narration: チケットを取った側です。頼まれなければ取らなかった。1枚分の1万2千円は払うのが当然だ、と主張。
  defendant_claim: 行ってないのに払うのはおかしい
  defendant_narration: 仕事で本当に行けなくなった。別の人に譲ればいいし、行ってもいないライブの代金は払えない、と反論。
  question: 親友は代金を払うべき？
  option_a: 払うべき
  option_b: 払わなくていい
  tags: [推し活, ライブ, 友達]
  hints:
    - title: 頼まれた時点で約束は成立？
      text: 「取って」と頼み、相手が取った時点で、代金を払う約束ができていたと考えるか。行けなくなったら取り消せる程度の頼みだったと考えるか。
    - title: 前日のキャンセルはどれくらい重い？
      text: 前日では、ほかの人に譲るのも簡単ではありません。キャンセルのタイミングが早ければ判断は変わったでしょうか。
    - title: 友達同士のお金の貸し借り
      text: お店なら当然払うキャンセル料も、友達同士だと「なあなあ」になりがち。友情を守るために、どちらが折れるべきかも考えどころです。

- title: リモートワーク電気代事件
  category: 職場
  hook: 会社が決めた在宅勤務。でも電気代は誰が払う？
  summary: 在宅勤務で増えた電気代を会社に請求
  summary_narration: 会社の方針で、週5日の在宅勤務になった社員。夏とあわせて電気代が月に8千円も増えました。そこで会社に請求したところ、断られてしまいます。
  plaintiff_claim: 会社の都合なんだから会社が払うべき
  plaintiff_narration: 社員側です。在宅勤務を決めたのは会社。仕事で使う電気代は、仕事の経費と同じだ、と主張。
  defendant_claim: 通勤がなくなって得している部分もある
  defendant_narration: 会社側です。通勤の時間もお金もかからなくなった。その分で十分まかなえるはずだ、と反論しています。
  question: 会社は電気代を払うべき？
  option_a: 払うべき
  option_b: 払わなくていい
  tags: [リモートワーク, 在宅勤務, 電気代, 仕事]
  hints:
    - title: 誰の都合で増えた出費？
      text: 在宅勤務は会社が決めたこと。会社の都合で増えた出費なら会社が持つべき、という考え方があります。
    - title: 浮いたお金と増えたお金
      text: 通勤の時間や交通費、昼食代が浮いた人もいるはず。増えた分だけを見るか、差し引きで見るかで答えが変わります。
    - title: 仕事の電気と生活の電気は分けられる？
      text: エアコンは仕事中も休憩中もついています。どこまでが仕事の分かを決めにくいことも、この問題を難しくしています。

- title: フリマの「ほぼ新品」事件
  category: お金
  hook: フリマアプリで買った「ほぼ新品」。届いたら小さな傷が…
  summary: 「ほぼ新品」のカメラに小さな傷があった
  summary_narration: フリマアプリで、ほぼ新品と書かれたカメラを5万円で購入。届いてみると、よく見ないと分からない小さな傷が一つありました。
  plaintiff_claim: 傷があるならほぼ新品とは言えない
  plaintiff_narration: 買った側です。傷があると知っていたら買わなかった。全額返金してほしい、と主張しています。
  defendant_claim: 使えば付く程度の傷。だから「ほぼ」
  defendant_narration: 売った側です。新品とは書いていない。ほぼ、と書いたのはこういう小さな傷のためだ、と反論。
  question: 全額返金するべき？
  option_a: 返金すべき
  option_b: 返金不要
  tags: [フリマアプリ, メルカリ, 返金]
  hints:
    - title: 「ほぼ新品」の基準は人それぞれ
      text: 売る側の「ほぼ」と買う側の「ほぼ」は同じとは限りません。あいまいな言葉の責任は、書いた側と読んだ側のどちらにあるでしょうか。
    - title: 写真で分かったかどうか
      text: 出品写真で傷が確認できたなら、買う側も納得していたと言えます。写らない程度の傷だったなら、伝えなかった側の責任が重くなるかもしれません。
    - title: 全額返金か、一部返金か
      text: AかBかで考えると極端になりがちです。あなたなら、どんな落としどころを提案しますか？

- title: 割り勘アプリの1円事件
  category: お金
  hook: 飲み会の割り勘。たった数十円で、友情にヒビが入りました。
  summary: 割り勘の端数を毎回幹事が切り上げていた
  summary_narration: 毎月の飲み会で幹事をしている人が、割り勘の端数を毎回切り上げて集めていました。1年で、余ったお金はおよそ6千円になっていました。
  plaintiff_claim: 余ったお金はみんなに返すべき
  plaintiff_narration: 参加者側です。少しずつでも、みんなのお金。勝手に自分のものにするのはおかしい、と主張。
  defendant_claim: 幹事の手間賃としては安いくらい
  defendant_narration: 幹事側です。店選びも予約も集金も、全部自分がやってきた。これくらいは手間賃だ、と反論しています。
  question: 余ったお金は返すべき？
  option_a: 返すべき
  option_b: 手間賃でいい
  tags: [割り勘, 飲み会, 幹事]
  hints:
    - title: 少額なら許される？
      text: 1回あたりは数十円。でも積み重なれば6千円です。金額の大きさで判断が変わるのかどうかがポイントです。
    - title: 黙っていたことの重さ
      text: 最初に「端数は手間賃でもらうね」と言っていれば、問題にならなかったかもしれません。
    - title: 幹事の苦労はお金で返すもの？
      text: 幹事の手間に感謝はしても、お金で払う約束はしていません。感謝とお金をどう分けるかで意見が割れます。

- title: 隣の家の柿の木事件
  category: 近所
  hook: 隣の家から伸びてきた柿の木。実を食べたら怒られました。
  summary: 塀を越えて伸びた枝の柿を食べたら苦情
  summary_narration: 隣の家の柿の木の枝が、塀を越えて自分の庭まで伸びてきました。毎年落ち葉の掃除をしているので、その枝の柿を取って食べたところ、隣人が怒りました。
  plaintiff_claim: 木はうちのもの。実を勝手に取らないで
  plaintiff_narration: 柿の木の持ち主です。枝がどこにあっても、うちの木の実。勝手に取るのは泥棒と同じだ、と主張。
  defendant_claim: 落ち葉の掃除をしてるのはこっちだ
  defendant_narration: 庭の持ち主です。毎年の落ち葉掃除はこっちの負担。庭に来た実くらい食べてもいいだろう、と反論。
  question: 柿を食べたのは悪い？
  option_a: 悪い
  option_b: 悪くない
  tags: [近所トラブル, 柿, 庭]
  hints:
    - title: 木の持ち主と土地の持ち主
      text: 実がなっている枝は自分の庭の上。それでも実は木の持ち主のものか。身近なのに意外と答えに迷うテーマです。
    - title: 迷惑と恩恵は相殺できる？
      text: 落ち葉の掃除という迷惑を受けているから、実を食べてもいい。この「おあいこ」の考え方に納得できるかどうか。
    - title: 一言かけていれば…
      text: 「もらっていい？」と聞いていれば、きっと揉めませんでした。ご近所付き合いでは、正しさよりも順番が大事なこともあります。

- title: 結婚式ご祝儀の差額事件
  category: 友達
  hook: 3万円包んだ友人の結婚式。自分のときは1万円でした。
  summary: 自分は3万円包んだのに、お返しは1万円
  summary_narration: 5年前、友人の結婚式で3万円のご祝儀を包みました。ところが今年、自分の結婚式に来た友人のご祝儀は1万円。理由を聞くと、今は生活が苦しいとのこと。
  plaintiff_claim: 同じ額を包むのがマナーでしょう
  plaintiff_narration: 3万円を包んだ側です。もらった額と同じだけ返すのが常識。差額の2万円は気持ちとして返してほしい、と主張。
  defendant_claim: ご祝儀はお祝いの気持ち。額じゃない
  defendant_narration: 1万円を包んだ側です。今の自分にできる精一杯だった。ご祝儀は貸し借りではない、と反論しています。
  question: 差額の2万円を払うべき？
  option_a: 払うべき
  option_b: 払わなくていい
  tags: [結婚式, ご祝儀, マナー]
  hints:
    - title: ご祝儀はお祝い？それとも貸し借り？
      text: もらった額を返すのがマナーとされる一方、ご祝儀は本来お祝いの気持ち。どちらの性格が強いと考えるかで答えが変わります。
    - title: 事情は考慮されるべき？
      text: 今は生活が苦しいという理由に、どこまで配慮するか。正直に話してくれたことをどう受け止めるかもポイントです。
    - title: お金を求めることの是非
      text: たとえ差額に納得できなくても、それを相手に請求するのはどうなのか。請求した時点で関係が変わってしまうかもしれません。

- title: SNSに写り込んだ顔事件
  category: SNS
  hook: 友達がSNSに上げた集合写真。そこに写っていたのは…
  summary: 許可なく集合写真をSNSに投稿され大炎上
  summary_narration: 友達が、旅行の集合写真をSNSに投稿しました。その投稿が思わぬ形で拡散され、写っていた一人は、職場の人に休みの理由がばれてしまいました。
  plaintiff_claim: 載せる前に一言聞いてほしかった
  plaintiff_narration: 写っていた側です。顔が出る写真を載せるなら、先に許可を取るべき。迷惑したので謝ってほしい、と主張。
  defendant_claim: みんなで撮った写真。悪気はない
  defendant_narration: 投稿した側です。みんなで撮って、楽しかった思い出を載せただけ。拡散までは予想できない、と反論。
  question: 投稿した側が謝るべき？
  option_a: 謝るべき
  option_b: 謝らなくていい
  tags: [SNS, 写真, 拡散, プライバシー]
  hints:
    - title: 写真を撮ることと載せることは別
      text: 一緒に写真を撮ることには同意していても、ネットに載せることまで同意したとは限りません。
    - title: 拡散まで責任を持つべき？
      text: 載せた本人は、まさか広まるとは思っていませんでした。予想できなかった結果まで責任を負うべきでしょうか。
    - title: 当たり前はアップデートされる
      text: 昔は気にしなかったことも、今はトラブルになる時代。あなたの周りでは「載せる前に聞く」が当たり前になっていますか？

- title: サブスク解約し忘れ事件
  category: 家族
  hook: 家族の共有カードで1年間払い続けていたサブスク。犯人は…
  summary: 解約し忘れたサブスクが家族のカードで1年
  summary_narration: 家族で共有しているクレジットカードから、月2千円の動画サブスクが1年間引き落とされていました。登録したのは大学生の兄。本人は、1回見ただけで忘れていたそうです。
  plaintiff_claim: 使ってないとしても登録した人の責任
  plaintiff_narration: 親側です。登録したのは兄。1年分、2万4千円はアルバイト代から返してほしい、と主張。
  defendant_claim: 毎月の明細を見ない親にも責任がある
  defendant_narration: 兄側です。家族のカードなら、明細は親がチェックするもの。気づかなかった親にも責任がある、と反論。
  question: 兄が全額返すべき？
  option_a: 全額返すべき
  option_b: 全額は不要
  tags: [サブスク, 家族, クレジットカード]
  hints:
    - title: 登録した人の責任
      text: 自分で登録したサービスは、自分で管理するのが基本。1回しか見ていないのは本人の事情です。
    - title: 明細を見る人の責任
      text: 家族共有のカードなら、毎月の明細を見る役割の人もいるはず。1年間気づかなかったことをどう考えるか。
    - title: 家族のお金はどこまで厳しく？
      text: 家族だから大目に見るか、家族だからこそきちんと返すか。家庭によって考え方が大きく分かれるテーマです。

- title: 副業がバレた会社員事件
  category: 職場
  hook: 夜にこっそり続けていた副業。それが会社にバレました。
  summary: 副業を会社に報告せず、ボーナスを減らされた
  summary_narration: 会社員が、夜と週末に動画編集の副業をしていました。会社のルールでは副業には届け出が必要。報告していなかったことが分かり、ボーナスを減らされてしまいます。
  plaintiff_claim: 本業に迷惑はかけていない
  plaintiff_narration: 会社員側です。仕事の時間には一切やっていない。本業にも迷惑はかけていないので、ボーナスを元に戻してほしい、と主張。
  defendant_claim: ルールを守らなかったことが問題
  defendant_narration: 会社側です。副業そのものは禁止していない。届け出をしなかった、ルール違反が問題なのだ、と反論しています。
  question: ボーナスを元に戻すべき？
  option_a: 戻すべき
  option_b: 減らしていい
  tags: [副業, 会社員, ボーナス]
  hints:
    - title: 中身の問題か、手続きの問題か
      text: 副業そのものは禁止されていません。問題は届け出をしなかったこと。手続きのミスにどこまで重い処分がふさわしいでしょうか。
    - title: 本業に影響がなければいい？
      text: 仕事中にはやっていない、本業にも迷惑をかけていない。結果に問題がなければルール違反は軽く見てよいのか。
    - title: ルールそのものは妥当？
      text: 副業が当たり前になりつつある今、届け出のルールが時代に合っているかどうかも考えてみたいところです。
