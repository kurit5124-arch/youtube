# 「昨日の多数決」のお題帳（python main.py --source poll）
#
# 毎日1つ選ばれ、動画のコメント（A / B / C）で投票してもらいます。
# 次の日の動画で結果を発表します。
#
# - id: お題のID（英数字。一度決めたら変えない。結果の記録に使う）
#   question: お題（短いほど読みやすい。20文字くらいまで）
#   emoji: イラスト（絵文字1つ。省略時は自動）
#   choices:            # 2〜3個。label は短く（8文字くらいまで）
#     - label: 醤油
#       words: [しょうゆ, しょう油]   # コメントにこの言葉があれば、この選択肢の票として数える（省略可）
#   months: [12]        # この月だけ使う（省略可）
#   dates: ["12-24"]    # この日に優先して使う（省略可）
#   tags: [タグ, ...]
#
# お題選びのコツ
# - 誰でも答えられる・どちらも「わかる」と言える・ケンカになりにくいもの
# - 政治・宗教・特定の人や地域をけなすお題は入れない

