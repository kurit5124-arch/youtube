  description: |
    小学生の自転車事故で、母親に約9500万円の賠償命令。あなたはこの判決、納得できますか？
    コメントに「A（納得できる）」か「B（納得できない）」と、理由を書いてください。

    ■ 事故（2008年・神戸市）
    坂道を自転車で下っていた小学5年生の男の子が、歩いていた62歳の女性と衝突。女性は頭を強く打ち、意識が戻らない状態になりました。

    ■ 判決（2013年・神戸地裁）
    子どもへの指導や注意が不十分だったとして、母親に約9500万円の賠償を命じました。

    ■ その後
    この判決をきっかけに、自転車保険の加入を義務にする自治体が増えました（兵庫県が2015年に全国で初めて条例で義務化）。

    ※報道をもとに要約しています。イラストはイメージです。
    ※当事者の方への誹謗中傷はおやめください。

