# イラスト付きストーリー動画の台本（実話・解説系）
#   python main.py --story-file stories.yaml --story-index 0
#
# 方針
# - 報道された事実だけを書く。確信の持てない数字や名前は書かない（当事者の名前は出さない）
# - 判決への賛否は同じ重さで紹介し、最後は視聴者に問う
# - 説明文に「報道をもとにした要約」「当事者への誹謗中傷禁止」を必ず入れる
#
# 伸びているショートの型を当てはめる
#   1) 最初の1秒で「数字＋疑問」  2) 3〜7秒ごとに場面を切り替える
#   3) 表情のある人物で感情を見せる  4) 賛否両論でコメントを誘う
#   5) シリーズ名と番号で「次も見たい」を作る  6) 最後の一言が最初につながる（ループ）
#
# 場面（scenes）の書き方
#   label: 小見出し / text: 字幕 / narration: 読み上げ
#   art:
#     bg: street | courtroom | hospital | net | home
#     cast: [{who: child|woman|mother|elder_woman|man|man2|judge,
#             expr: neutral|happy|angry|sad|shock|worried|serious,
#             x: 0〜1（横位置）, scale: 大きさ, flip: 左右反転, bike: 自転車, fx: 効果の絵文字(💢💦❗❓)}]
#     speaker: しゃべる人の番号（口が動く）/ big: 大きく出す言葉 / shake: 揺らす
#   選択肢の場面: choices: [Aの言葉, Bの言葉]

