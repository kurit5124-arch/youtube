name: 毎日ショート動画を作って投稿

on:
  schedule:
    # 毎日 16:30 (日本時間) = 07:30 (UTC)
    - cron: "30 7 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "ネタ (auto / today / topics)"
        default: auto
      date:
        description: "日付 YYYY-MM-DD（空なら今日）"
        default: ""
      upload:
        description: "YouTube に投稿する"
        type: boolean
        default: true

concurrency:
  group: daily-short
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Tokyo
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: ffmpeg と日本語フォントを入れる
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk fonts-noto-cjk-extra

      - name: Python ライブラリを入れる
        run: pip install -r requirements.txt

      - name: 動画を作る（＋投稿）
        env:
          IN_SOURCE: ${{ inputs.source }}
          IN_DATE: ${{ inputs.date }}
          IN_UPLOAD: ${{ inputs.upload }}
          EVENT: ${{ github.event_name }}
        run: |
          ARGS=()
          [ -n "$IN_SOURCE" ] && ARGS+=(--source "$IN_SOURCE")
          [ -n "$IN_DATE" ] && ARGS+=(--date "$IN_DATE")
          # 定期実行 or 手動で upload=true、かつ Secrets があるときだけ投稿
          if [ "$EVENT" = "schedule" ] || [ "$IN_UPLOAD" = "true" ]; then
            if [ -n "$YT_REFRESH_TOKEN" ]; then
              ARGS+=(--upload)
            else
              echo "::warning::YouTube の Secrets が未設定なので、動画ファイルだけ作ります"
            fi
          fi
          python main.py "${ARGS[@]}"

      - name: 動画ファイルを保存（Actions の画面からダウンロード可）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_number }}
          path: |
            output/*.mp4
            output/*.json
          retention-days: 14
