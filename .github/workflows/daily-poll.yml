name: 昨日の多数決（毎日）

# 前の日の動画のコメントで投票を数えて「結果発表＋今日のお題」の動画を投稿します。
# 投稿した動画のIDは poll_state.json に記録してコミットします（明日の集計に使う）。
# 必要な Secrets: YT_CLIENT_ID / YT_CLIENT_SECRET / YT_REFRESH_TOKEN（メインと同じ）
#                 YT_API_KEY（コメントを読む用の API キー。無いと結果発表なしになる）

on:
  schedule:
    - cron: "40 9 * * *"   # 夜 18:40 (日本時間) → 19時ごろ
  workflow_dispatch:
    inputs:
      upload:
        description: "YouTube に投稿する"
        type: boolean
        default: true

concurrency:
  group: daily-poll
  cancel-in-progress: false

permissions:
  contents: write   # poll_state.json をコミットするため

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Tokyo
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YT_API_KEY: ${{ secrets.YT_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: ffmpeg と日本語フォントを入れる
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk fonts-noto-cjk-extra fonts-noto-color-emoji

      - name: Python ライブラリを入れる
        run: pip install -r requirements.txt

      - name: 動画を作る（＋投稿）
        env:
          IN_UPLOAD: ${{ inputs.upload }}
          EVENT: ${{ github.event_name }}
        run: |
          ARGS=(--source poll)
          if [ "$EVENT" = "schedule" ] || [ "$IN_UPLOAD" = "true" ]; then
            if [ -n "$YT_REFRESH_TOKEN" ]; then
              ARGS+=(--upload)
            else
              echo "::warning::YouTube の Secrets が未設定なので、動画ファイルだけ作ります"
            fi
          fi
          [ -z "$YT_API_KEY" ] && echo "::warning::Secrets の YT_API_KEY が未設定なので、コメントの集計（結果発表）はできません"
          python main.py "${ARGS[@]}"

      - name: 今日のお題を記録（明日の集計用）
        run: |
          [ -z "$(git status --porcelain -- poll_state.json)" ] && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add poll_state.json
          git commit -m "多数決の記録を更新 [skip ci]"
          for i in 1 2 3 4; do git pull --rebase -q && git push -q && exit 0; sleep $((i * 5)); done
          exit 1

      - name: 動画ファイルを保存（Actions の画面からダウンロード可）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poll-short-${{ github.run_number }}
          path: |
            output/*.mp4
            output/*.json
          retention-days: 14
