name: アフィリエイト用チャンネルに毎日投稿

# メインのクイズチャンネルとは別の YouTube チャンネルに投稿します。
# 設定は channels/affiliate/（config.yaml / topics.yaml / affiliate.yaml）。
# 必要な Secrets: YT2_REFRESH_TOKEN（別チャンネルで取得したもの）
#   YT2_CLIENT_ID / YT2_CLIENT_SECRET は省略するとメインと同じ YT_CLIENT_ID / YT_CLIENT_SECRET を使う
# 任意の Variables: AMAZON_ASSOCIATE_TAG / RAKUTEN_AFFILIATE_ID
# 任意の Secrets: RAKUTEN_APP_ID / RAKUTEN_ACCESS_KEY（人気商品を自動で選ぶ）

on:
  schedule:
    # 時刻は UTC。1日2本（チャンネルを早く育てるため）
    - cron: "40 2 * * *"    # 昼 11:40 (日本時間) → 12時ごろ
    - cron: "40 9 * * *"    # 夜 18:40 (日本時間) → 19時ごろ
  workflow_dispatch:
    inputs:
      topic_index:
        description: "channels/affiliate/topics.yaml の何番目を使うか（0始まり、空なら日替わり）"
        default: ""
      upload:
        description: "YouTube に投稿する"
        type: boolean
        default: true

concurrency:
  group: affiliate-short
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Tokyo
      YT_CLIENT_ID: ${{ secrets.YT2_CLIENT_ID || secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT2_CLIENT_SECRET || secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT2_REFRESH_TOKEN }}
      AMAZON_ASSOCIATE_TAG: ${{ vars.AMAZON_ASSOCIATE_TAG }}
      RAKUTEN_AFFILIATE_ID: ${{ vars.RAKUTEN_AFFILIATE_ID }}
      RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
      RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: ffmpeg と日本語フォントを入れる
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk fonts-noto-cjk-extra fonts-noto-color-emoji

      - name: Python ライブラリを入れる
        run: pip install -r requirements.txt

      - name: 動画を作る（＋投稿）
        env:
          IN_INDEX: ${{ inputs.topic_index }}
          IN_UPLOAD: ${{ inputs.upload }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          ARGS=(--channel affiliate)
          # 昼の回は1本目、夜の回は2本目（同じ日に別のネタになる）
          case "$SCHEDULE" in
            "40 2 * * *") ARGS+=(--slot 0) ;;
            "40 9 * * *") ARGS+=(--slot 1) ;;
          esac
          [ -n "$IN_INDEX" ] && ARGS+=(--topic-index "$IN_INDEX")
          if [ "$EVENT" = "schedule" ] || [ "$IN_UPLOAD" = "true" ]; then
            if [ -n "$YT_REFRESH_TOKEN" ]; then
              ARGS+=(--upload)
            else
              echo "::warning::Secrets の YT2_REFRESH_TOKEN が未設定なので、動画ファイルだけ作ります"
            fi
          fi
          python main.py "${ARGS[@]}"

      - name: 動画ファイルを保存（Actions の画面からダウンロード可）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: affiliate-short-${{ github.run_number }}
          path: |
            output/*.mp4
            output/*.json
          retention-days: 14
