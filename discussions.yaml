#
# 項目は topics.yaml と同じ。追加で使えるもの:
#   hook_label / hook_emoji / outro_label / outro_emoji
#   points の label（小見出し）/ emoji / keep（長くても外さない）
#   palette（配色の番号。6 = 落ち着いた紺）/ voice（このネタだけ声を変える）/ category_id
#   bgm（BGM のパス。暗めの曲は assets/bgm_dark/。scripts/make_dark_bgm.py で作れます）

