  description: |
    2023年7月の刑法改正で生まれた「不同意性交等罪」。「男性に不利では？」という声がありますが、あなたはどう思いますか？
    賛否どちらの意見も紹介しています。理由と一緒にコメントで教えてください。

    ■ 事実
    ・2023年7月13日施行の刑法改正で、強制性交等罪・準強制性交等罪が「不同意性交等罪」になりました
    ・法律の文言は、被害者・加害者の性別を区別していません

    ■「男性に不利」と感じる声
    ・二人きりの場面で同意を証明するのは難しい
    ・冤罪が心配
    ・法改正後、事件として扱われる件数が増えたと報じられており、男性が訴えられやすくなったと不安を感じる

    ■「不利ではない」という声
    ・件数が増えたのは、これまで言い出せなかった被害が表に出てきたから
    ・男女どちらにも同じルールが適用される
    ・逮捕されても、証拠がなければ起訴されない

    ※特定の人物や事件について述べたものではありません。逮捕の段階では有罪は確定していません。
    ※コメント欄では、特定の人や被害を訴える人への攻撃はご遠慮ください。

