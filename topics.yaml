# 雑学ネタ帳（source: topics のときに日替わりで使われます）
# 自由に追加・編集してください。points は 3〜4 個がちょうど 1 分弱です。
#
# - title: 動画のテーマ（画面上部とタイトルに使用）
#   hook: 最初の読み上げ
#   hook_text: 最初のスライドの文字（省略時は title）
#   emoji: テーマのイラスト（絵文字1つ。省略時は自動で選ぶ）
#   points:                 # 文字列 or {text: 画面の文字, narration: 読み上げ, emoji: 絵文字}
#   tags: [タグ, ...]
#
# 夜は1日2本（2つずつ順番に）使います。ネタの数 ÷ 2 日で一周します。

- title: 猫の意外な雑学
  emoji: 🐱
  hook: 猫好きでも意外と知らない、猫の雑学を3つ紹介します。
  hook_text: "猫好きも\n知らない雑学"
  points:
    - text: 猫は1日の大半を寝て過ごす
      narration: 猫は1日に12時間から16時間も眠ると言われています。
    - text: 猫の鼻の模様は一匹ずつ違う
      narration: 猫の鼻のしわの模様は、人間の指紋のように一匹ずつ違うそうです。
    - text: 猫は甘みを感じにくい
      narration: 猫は甘みを感じる仕組みがうまく働かず、甘さをほとんど感じないと言われています。
  tags: [猫, 雑学, 動物, shorts]

- title: 宇宙のびっくり雑学
  emoji: 🚀
  hook: 知ると夜空の見え方が変わる、宇宙の雑学です。
  hook_text: "宇宙の\nびっくり雑学"
  points:
    - text: 金星の1日は1年より長い
      narration: 金星は自転がとても遅く、1日の長さが1年よりも長いんです。
    - text: 宇宙は無音の世界
      narration: 宇宙には音を伝える空気がないので、爆発が起きても音は聞こえません。
    - text: 夜空の星の光は過去の光
      narration: 今見ている星の光は、何年も、何千年も前にその星を出発した光です。
  tags: [宇宙, 雑学, 天文, shorts]

- title: 日本語のふしぎ
  emoji: 📖
  hook: 普段使っている日本語にも、意外なルーツがあります。
  hook_text: "日本語の\nふしぎ"
  points:
    - text: 「ありがとう」の語源は「有り難し」
      narration: ありがとうの語源は、めったにない、という意味の「有り難し」だと言われています。
    - text: 「いただきます」は命への感謝
      narration: いただきますには、食材の命をいただくという感謝の意味が込められています。
    - text: 「やばい」は江戸時代からある言葉
      narration: 若者言葉に思えるやばいは、江戸時代には既に使われていたと言われています。
  tags: [日本語, 雑学, 語源, shorts]

- title: 犬のすごい雑学
  emoji: 🐶
  hook: 犬を飼っている人も驚く、犬の雑学です。
  hook_text: "犬の\nすごい雑学"
  points:
    - text: 犬の鼻の模様は一匹ずつ違う
      narration: 犬の鼻の表面の模様は「鼻紋」と呼ばれ、人間の指紋のように一匹ずつ違います。
    - text: 犬はほとんど汗をかかない
      narration: 犬は汗をかく場所が肉球などに限られていて、舌を出してハァハァすることで体温を下げます。
    - text: 嗅覚は人間の数千倍以上
      narration: 犬の鼻は、においをかぎ分ける力が人間の数千倍以上とも言われています。
  tags: [犬, 雑学, 動物, shorts]

- title: 海のふしぎ
  emoji: 🌊
  hook: 身近なのに知らない、海のふしぎを紹介します。
  hook_text: "海の\nふしぎ"
  points:
    - text: 地球の表面の約7割は海
      narration: 地球の表面のおよそ7割は海におおわれています。
    - text: 一番深い場所は約1万メートル
      narration: 世界で一番深いマリアナ海溝は、深さがおよそ1万メートルもあります。富士山を2つ半以上沈められる深さです。
    - text: 海がしょっぱい理由
      narration: 海がしょっぱいのは、陸の岩などから溶け出した塩分が、長い年月をかけて川から海へ運ばれたためです。
  tags: [海, 雑学, 地球, shorts]

- title: 人の体のびっくり雑学
  emoji: 💪
  hook: 自分の体なのに意外と知らない、体の雑学です。
  hook_text: "人の体の\nびっくり雑学"
  points:
    - text: 大人の骨は約206個
      narration: 大人の骨はおよそ206個。赤ちゃんのときはもっと多く、成長とともにくっついて数が減ります。
    - text: 爪は1日に約0.1ミリ伸びる
      narration: 手の爪は、1日におよそ0.1ミリずつ伸びると言われています。
    - text: 歯のエナメル質は体で一番かたい
      narration: 歯の表面のエナメル質は、人の体の中で一番かたい部分です。
  tags: [体, 雑学, 健康, shorts]

- title: お寿司の雑学
  emoji: 🍣
  hook: 寿司好きなら知っておきたい、お寿司の雑学です。
  hook_text: "お寿司の\n雑学"
  points:
    - text: 回転寿司は大阪生まれ
      narration: 回転寿司は、1958年に大阪で生まれたと言われています。
    - text: 「ガリ」の名前の由来
      narration: しょうがの甘酢漬けをガリと呼ぶのは、かむとガリガリ音がするから、という説があります。
    - text: 「シャリ」の名前の由来
      narration: ご飯をシャリと呼ぶのは、お釈迦様の骨「仏舎利」に見立てたから、という説があります。
  tags: [寿司, 雑学, 食べ物, shorts]

- title: 動物の睡眠時間
  emoji: 😴
  hook: 動物によって、眠る時間は全然ちがいます。
  hook_text: "動物の\n睡眠時間"
  points:
    - text: コアラは1日20時間近く眠る
      narration: コアラは、1日に20時間近く眠ることもあると言われています。
      emoji: 🐨
    - text: キリンの睡眠はとても短い
      narration: 野生のキリンの睡眠は、1日にとても短い時間だけだと言われています。
      emoji: 🦒
    - text: イルカは脳を半分ずつ眠らせる
      narration: イルカは、脳を半分ずつ交代で眠らせて、泳ぎながら休むことができます。
      emoji: 🐬
  tags: [動物, 雑学, 睡眠, shorts]

- title: 天気のふしぎ
  emoji: ⛅
  hook: 毎日の天気にも、びっくりする事実があります。
  hook_text: "天気の\nふしぎ"
  points:
    - text: 雷は太陽の表面より熱い
      narration: 雷が通る道の温度は約3万度。太陽の表面、約6000度よりずっと熱いんです。
      emoji: ⚡
    - text: 雪の結晶は基本的に六角形
      narration: 雪の結晶は、水の分子の並び方の関係で、基本的に六角形になります。
      emoji: ❄️
    - text: 虹の色の数は国によってちがう
      narration: 日本では虹は7色と言われますが、6色や5色と数える国もあります。
      emoji: 🌈
  tags: [天気, 雑学, 自然, shorts]

- title: チョコレートの雑学
  emoji: 🍫
  hook: 甘いチョコレートの、意外な雑学です。
  hook_text: "チョコレートの\n雑学"
  points:
    - text: 昔のチョコは飲み物だった
      narration: チョコレートは、昔の中南米では、カカオから作る飲み物として飲まれていました。
    - text: 原料はカカオ豆
      narration: チョコレートの原料は、カカオの実の中にあるカカオ豆です。
    - text: 犬や猫にはチョコは危険
      narration: チョコに含まれるテオブロミンという成分は、犬や猫にとって毒になるので、あげてはいけません。
  tags: [チョコレート, 雑学, お菓子, shorts]

- title: 富士山の雑学
  emoji: 🗻
  hook: 日本一の山、富士山の雑学です。
  hook_text: "富士山の\n雑学"
  points:
    - text: 高さは3776メートル
      narration: 富士山の高さは3776メートル。日本で一番高い山です。
    - text: 山頂付近の県境は決まっていない
      narration: 富士山の山頂付近は、静岡県と山梨県の境目が決まっていないんです。
    - text: 2013年に世界文化遺産に
      narration: 富士山は2013年、世界文化遺産に登録されました。
  tags: [富士山, 雑学, 日本, shorts]

- title: パンダの雑学
  emoji: 🐼
  hook: みんな大好きパンダの、意外な雑学です。
  hook_text: "パンダの\n意外な雑学"
  points:
    - text: 生まれたときは100グラムほど
      narration: パンダの赤ちゃんは、生まれたとき100グラムほどしかありません。お母さんの約1000分の1です。
    - text: 主食は竹なのに肉食動物の仲間
      narration: パンダは竹ばかり食べますが、分類上はクマと同じ食肉目の仲間です。
    - text: 竹をつかむための「第6の指」
      narration: パンダの前足には、竹をつかむための出っぱりがあり、第6の指とも呼ばれます。
  tags: [パンダ, 雑学, 動物, shorts]

- title: 鉄道の雑学
  emoji: 🚃
  hook: 毎日乗る電車にも、知られざる歴史があります。
  hook_text: "鉄道の\n雑学"
  points:
    - text: 日本初の鉄道は新橋〜横浜
      narration: 日本で初めての鉄道は、1872年に新橋と横浜の間で開業しました。
    - text: 新幹線は東京オリンピックの直前に開業
      narration: 東海道新幹線は、1964年、東京オリンピックの開幕直前に開業しました。
      emoji: 🚄
    - text: 山手線は一周約34.5キロ
      narration: 東京の山手線は、一周がおよそ34.5キロメートルです。
  tags: [鉄道, 電車, 雑学, shorts]

- title: タコのびっくり雑学
  emoji: 🐙
  hook: タコは、実はとってもふしぎな生き物です。
  hook_text: "タコの\nびっくり雑学"
  points:
    - text: 心臓が3つある
      narration: タコには、心臓が3つもあります。
    - text: 血の色は青い
      narration: タコの血は、酸素を運ぶ成分に銅が含まれているため、青い色をしています。
    - text: 腕が自分で考えるように動く
      narration: タコの神経の多くは腕にあり、腕がそれぞれ考えるように動けると言われています。
  tags: [タコ, 雑学, 海の生き物, shorts]

- title: ハチミツの雑学
  emoji: 🍯
  hook: 甘いハチミツには、すごい秘密があります。
  hook_text: "ハチミツの\n雑学"
  points:
    - text: ハチミツはとても腐りにくい
      narration: ハチミツは糖分がとても多いので、とても腐りにくい食べ物です。
    - text: 1匹が一生で集める量はわずか
      narration: ミツバチ1匹が一生で集めるハチミツは、ティースプーン1杯にも満たないと言われています。
      emoji: 🐝
    - text: 1歳未満の赤ちゃんには与えない
      narration: ハチミツは、1歳未満の赤ちゃんには与えてはいけません。乳児ボツリヌス症の原因になることがあります。
  tags: [ハチミツ, 雑学, 食べ物, shorts]

- title: 月の雑学
  emoji: 🌕
  hook: 夜空に浮かぶ月の、知られざる雑学です。
  hook_text: "月の\n雑学"
  points:
    - text: 月はいつも同じ面を向けている
      narration: 月は、いつも同じ面を地球に向けています。裏側は地球から見ることができません。
    - text: 月は毎年少しずつ遠ざかっている
      narration: 月は、毎年およそ3.8センチずつ地球から遠ざかっています。
    - text: 月の重力は地球の約6分の1
      narration: 月の重力は地球の約6分の1。体重60キロの人も、月では10キロ分の重さしか感じません。
  tags: [月, 宇宙, 雑学, shorts]

- title: トマトの雑学
  emoji: 🍅
  hook: 赤くておいしいトマトの、意外な歴史です。
  hook_text: "トマトの\n雑学"
  points:
    - text: 昔は観賞用だった
      narration: トマトは、ヨーロッパに伝わった当初、食べ物ではなく観賞用として育てられていたと言われています。
    - text: 野菜か果物かで裁判に
      narration: アメリカでは、トマトが野菜か果物かをめぐって、裁判になったことがあります。
    - text: 赤い色はリコピン
      narration: トマトの赤い色は、リコピンという成分によるものです。
  tags: [トマト, 雑学, 野菜, shorts]

- title: ペンギンの雑学
  emoji: 🐧
  hook: かわいいペンギンの、意外な雑学です。
  hook_text: "ペンギンの\n意外な雑学"
  points:
    - text: 赤道近くにすむペンギンもいる
      narration: ペンギンは寒い所だけでなく、赤道に近いガラパゴス諸島にすんでいる種類もいます。
    - text: 足は実は長い
      narration: ペンギンの足は短く見えますが、実は体の中で長い脚を曲げているんです。
    - text: 水中では時速30キロ以上
      narration: 空は飛べませんが、水中では時速30キロ以上で泳ぐ種類もいます。
  tags: [ペンギン, 雑学, 動物, shorts]

- title: カラスの賢さ
  emoji: 🐦
  hook: カラスは、鳥の中でもとても賢いと言われています。
  hook_text: "カラスの\n賢さ"
  points:
    - text: 人の顔を覚える
      narration: カラスは人の顔を見分けて、覚えることができると言われています。
    - text: 道具を使うカラスもいる
      narration: ニューカレドニアにすむカラスは、枝を道具にして虫を取り出します。
    - text: 遊ぶこともある
      narration: カラスが雪の斜面をすべったり、遊ぶようなしぐさをする姿も観察されています。
  tags: [カラス, 雑学, 動物, shorts]

- title: コーヒーの雑学
  emoji: ☕
  hook: 毎日飲む人も多いコーヒーの雑学です。
  hook_text: "コーヒーの\n雑学"
  points:
    - text: ヤギが見つけたという伝説
      narration: コーヒーは、赤い実を食べて元気になったヤギを見て見つかった、という言い伝えがあります。
    - text: コーヒー豆は果実の種
      narration: コーヒー豆は、実は赤い果実の中にある種です。
    - text: カフェインは植物の身を守る仕組み
      narration: カフェインは、植物が虫などから身を守るために作っていると考えられています。
  tags: [コーヒー, 雑学, 飲み物, shorts]

- title: 恐竜の雑学
  emoji: 🦖
  hook: 太古の地球にいた恐竜の、意外な事実です。
  hook_text: "恐竜の\n雑学"
  points:
    - text: 鳥は恐竜の子孫
      narration: 今いる鳥は、恐竜の子孫だと考えられています。
      emoji: 🐦
    - text: ティラノとステゴは時代がちがう
      narration: ティラノサウルスとステゴサウルスは、生きていた時代が数千万年もはなれています。
    - text: 「サウルス」はトカゲという意味
      narration: 恐竜の名前によくつくサウルスは、トカゲという意味の言葉です。
  tags: [恐竜, 雑学, 生き物, shorts]

- title: 地球の雑学
  emoji: 🌍
  hook: わたしたちが住む地球の、すごい雑学です。
  hook_text: "地球の\n雑学"
  points:
    - text: 地球の年齢は約46億歳
      narration: 地球が生まれたのは、およそ46億年前だと考えられています。
    - text: 赤道では時速約1700キロで回っている
      narration: 地球の自転のスピードは、赤道あたりで時速およそ1700キロメートルです。
    - text: 地球は少し横にふくらんでいる
      narration: 地球は完全な球ではなく、自転の影響で少し横にふくらんだ形をしています。
  tags: [地球, 雑学, 宇宙, shorts]

- title: バナナの雑学
  emoji: 🍌
  hook: 身近な果物、バナナの意外な雑学です。
  hook_text: "バナナの\n雑学"
  points:
    - text: バナナは木ではなく草
      narration: バナナは木のように見えますが、植物としては大きな草の仲間です。
    - text: 野生のバナナは種だらけ
      narration: お店のバナナにはほとんど種がありませんが、野生のバナナには大きな種がたくさんあります。
    - text: 植物学ではベリーの仲間
      narration: 植物学の分け方では、バナナはベリーの仲間に入ります。
  tags: [バナナ, 雑学, 果物, shorts]

- title: オリンピックの雑学
  emoji: 🏅
  hook: 4年に一度のオリンピック、意外な雑学です。
  hook_text: "オリンピックの\n雑学"
  points:
    - text: 金メダルは純金ではない
      narration: 今のオリンピックの金メダルは、純金ではなく、銀に金メッキをしたものです。
      emoji: 🥇
    - text: 5つの輪は5つの大陸
      narration: オリンピックの5つの輪は、世界の5つの大陸を表しています。
    - text: 日本初の金メダルは三段跳び
      narration: 日本人初のオリンピック金メダルは、1928年、織田幹雄選手の三段跳びです。
  tags: [オリンピック, スポーツ, 雑学, shorts]

- title: 歯の雑学
  emoji: 🦷
  hook: 毎日みがく歯の、意外な雑学です。
  hook_text: "歯の\n雑学"
  points:
    - text: 大人の歯は全部で32本
      narration: 大人の歯は、親知らずを入れると全部で32本です。
    - text: 子どもの歯は20本
      narration: 子どもの乳歯は全部で20本。だいたい6歳ごろから大人の歯に生え変わります。
    - text: サメの歯は何度も生え変わる
      narration: サメの歯は、抜けても次々に新しい歯が生えてきます。
      emoji: 🦈
  tags: [歯, 雑学, 健康, shorts]

- title: 雪のふしぎ
  emoji: ⛄
  hook: 冬に降る雪の、ふしぎな雑学です。
  hook_text: "雪の\nふしぎ"
  points:
    - text: 雪が白く見える理由
      narration: 雪の結晶は透明ですが、光をいろいろな方向に反射するので白く見えます。
    - text: 雪の日が静かな理由
      narration: 雪が降ると静かに感じるのは、積もった雪のすき間が音を吸収するからです。
    - text: 日本は世界有数の雪国
      narration: 日本の日本海側は、世界でも有数の雪が多い地域として知られています。
  tags: [雪, 冬, 雑学, shorts]

- title: お金の雑学
  emoji: 💴
  hook: 毎日使うお金の、知られざる雑学です。
  hook_text: "お金の\n雑学"
  points:
    - text: 新しい1万円札は渋沢栄一
      narration: 2024年から発行されている新しい1万円札の肖像は、渋沢栄一です。
    - text: お札の原料は植物
      narration: 日本のお札は、ミツマタなどの植物の繊維から作られた、特別な紙でできています。
    - text: 1円玉を作るには1円以上かかる
      narration: 1円玉を1枚作るのには、1円以上の費用がかかると言われています。
  tags: [お金, 雑学, 日本, shorts]

- title: アリの雑学
  emoji: 🐜
