# ===== ショート動画 自動生成の設定 =====

# ネタの取り方
#   auto   : Wikipedia「今日は何の日」→ 失敗したら topics.yaml
#   today  : Wikipedia「今日は何の日」だけ
#   topics : topics.yaml の雑学ネタ（日替わり）
source: auto
timezone: Asia/Tokyo

# 読み上げ音声（無料）
#   engine: voicevox … ずんだもん などのキャラクター音声（説明文に「音声：VOICEVOX:ずんだもん」を自動で入れます）
#           edge     … Edge TTS（女性: ja-JP-NanamiNeural / 男性: ja-JP-KeitaNeural）
voice:
  engine: voicevox
  speaker: ずんだもん   # ずんだもん / ずんだもん（あまあま）/ ずんだもん（ツンツン）/ 四国めたん / 春日部つむぎ など
  speed: 1.3           # VOICEVOX の話す速さ（1.0 が標準）
  intonation: 1.2      # 抑揚の強さ（大きいほど感情豊か）
  volume: 1.6          # 声の大きさ（1.0 が標準）
  # 以下は Edge TTS 用（VOICEVOX が使えないときの代わりにも使います）
  name: ja-JP-NanamiNeural
  rate: "+15%"     # 話す速さ
  pitch: "+0Hz"

max_seconds: 58      # ショートに収めるための最大秒数（超えたら項目を減らす）
scene_gap: 0.35      # シーン間の間（秒）
bgm_dir: assets/bgm  # ここに mp3 を置くと BGM として使う（著作権フリーのものを）
bgm_volume: 0.15
# font: assets/fonts/YourFont.ttf   # 好きなフォントを使う場合

outro_narration: 明日もお楽しみになのだ！チャンネル登録よろしくなのだ！
quiz_outro_narration: 何問わかったのだ？コメントで教えてほしいのだ！チャンネル登録もよろしくなのだ！

today:
  format: quiz           # quiz = 3択「何年？」クイズ / list = 出来事の紹介
  quiz_max_chars: 36     # クイズの問題文の最大文字数（長いと3問入らない）
  num_events: 3          # 紹介する出来事の数
  include_observance: true  # 記念日も紹介する
  min_year: 1600         # これより古い出来事は基本的に選ばない
  max_chars: 60          # 1項目の最大文字数

upload:
  # private / unlisted / public
  # ※ Google の審査を通していない API プロジェクトから投稿した動画は
  #    強制的に「非公開」になります（README 参照）
  privacy: public
  category_id: 27        # 27=教育, 24=エンタメ, 22=ブログ
  made_for_kids: false

# ===== みんなの裁判（python saiban.py）=====
saiban:
  model: claude-opus-5-5   # 事件を作る Claude のモデル（ANTHROPIC_API_KEY があるときだけ使用）
  effort: medium           # low / medium / high（高いほど丁寧だが費用が増える）
  max_case_chars: 300      # 事件の読み上げの合計文字数の上限（1分に収めるため）
  max_seconds: 59          # 判決発表＋事件の合計の目安
  min_hours: 12            # 前回の投稿からこれだけ時間がたっていたら判決を集計する
  min_votes: 1             # これより票が少なければ判決発表を入れない
  style: anime             # anime = 動くアニメ風 / card = 静止画のカード型
  outro_narration: あなたの判決は？コメントにAかBで投票するのだ！結果は次回発表するのだ！
  cases: saiban/cases.yaml     # 手持ちの事件
  history: saiban/history.json # 投稿した事件と判決の記録（自動で更新・コミットされる）
