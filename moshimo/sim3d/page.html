<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head>
<body>
<script type="module">
import { SCENES, THREE } from './scenes.js';
let r, s, dur = 1;
window.init = (name, params, duration, w, h) => {
  r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  r.setPixelRatio(1); r.setSize(w, h);
  r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
  r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping;
  document.body.appendChild(r.domElement);
  s = SCENES[name](params || {}); s.camera.aspect = w / h; s.camera.updateProjectionMatrix();
  dur = duration;
};
window.renderAt = (t) => { s.update(t, dur); r.render(s.scene, s.camera); };
window.ready = true;
</script>
</body></html>
