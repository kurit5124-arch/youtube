<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- 犯人の黒猫（three.js で作った3Dモデル）。render.js が1コマずつ renderFrame() を呼んで画像にする -->
<style>html,body{margin:0;background:transparent;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script>
</head>
<body>
<script type="module">
import * as THREE from "three";

const SIZE = Number(new URLSearchParams(location.search).get("size") || 900);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(SIZE, SIZE);
renderer.setClearColor(0x000000, 0);
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);

// ---------------- ライト（暗い部屋＋背中から赤い光＝犯人っぽさ）
scene.add(new THREE.AmbientLight(0x30263a, 0.9));
const key = new THREE.SpotLight(0xfff1e0, 60, 20, Math.PI / 6, 0.6, 1.4);
key.position.set(1.5, 6, 4.5); key.target.position.set(0, 1.6, 0);
key.castShadow = true; key.shadow.mapSize.set(1024, 1024);
scene.add(key, key.target);
const rimL = new THREE.PointLight(0xff1a2a, 40, 12, 1.5); rimL.position.set(-2.6, 2.8, -2.2); scene.add(rimL);
const rimR = new THREE.PointLight(0xff3020, 30, 12, 1.5); rimR.position.set(2.6, 2.2, -2.0); scene.add(rimR);
const under = new THREE.PointLight(0x5533ff, 4, 6, 2); under.position.set(0, 0.3, 2.5); scene.add(under);

// ---------------- 材質
const fur = new THREE.MeshStandardMaterial({ color: 0x17161c, roughness: 0.55, metalness: 0.05 });
const furLight = new THREE.MeshStandardMaterial({ color: 0x45424c, roughness: 0.6 });
const pink = new THREE.MeshStandardMaterial({ color: 0xd9607a, roughness: 0.45 });
const mouthMat = new THREE.MeshStandardMaterial({ color: 0x3a0a10, roughness: 0.8 });
const eyeMat = new THREE.MeshStandardMaterial({ color: 0xffd21a, emissive: 0xffb000, emissiveIntensity: 1.6, roughness: 0.2 });
const pupilMat = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.1 });
const whiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
const whiskerMat = new THREE.LineBasicMaterial({ color: 0xbfbfc8, transparent: true, opacity: 0.8 });

const mesh = (geo, mat, parent, pos = [0, 0, 0], scale = [1, 1, 1], rot = [0, 0, 0]) => {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(...pos); m.scale.set(...scale); m.rotation.set(...rot);
  m.castShadow = true; m.receiveShadow = true;
  parent.add(m); return m;
};
const sph = (r = 1, s = 40) => new THREE.SphereGeometry(r, s, s);

// ---------------- 猫のからだ（座っている姿勢）
const cat = new THREE.Group(); scene.add(cat);
const body = new THREE.Group(); cat.add(body);
mesh(sph(), fur, body, [0, 0.85, -0.2], [0.85, 0.9, 0.85]);         // おしり〜胴
mesh(sph(), fur, body, [0, 1.6, 0.1], [0.58, 0.75, 0.5]);           // 胸
mesh(sph(), fur, body, [-0.55, 0.55, 0.05], [0.42, 0.42, 0.62]);     // 後ろ足（もも）
mesh(sph(), fur, body, [0.55, 0.55, 0.05], [0.42, 0.42, 0.62]);
mesh(sph(), fur, body, [-0.5, 0.12, 0.55], [0.22, 0.13, 0.3]);       // 後ろ足の先
mesh(sph(), fur, body, [0.5, 0.12, 0.55], [0.22, 0.13, 0.3]);

// 前足（右前足は毛づくろいで持ち上げる）
const legGeo = new THREE.CapsuleGeometry(0.15, 0.95, 8, 24);
const legL = new THREE.Group(); legL.position.set(-0.24, 1.35, 0.55); body.add(legL);
mesh(legGeo, fur, legL, [0, -0.6, 0]); mesh(sph(), fur, legL, [0, -1.22, 0.08], [0.2, 0.12, 0.25]);
const legR = new THREE.Group(); legR.position.set(0.24, 1.35, 0.55); body.add(legR);
mesh(legGeo, fur, legR, [0, -0.6, 0]); const pawR = mesh(sph(), fur, legR, [0, -1.22, 0.08], [0.2, 0.12, 0.25]);
mesh(sph(), pink, legR, [0, -1.25, 0.25], [0.08, 0.05, 0.05]);

// しっぽ（節をつないで、ゆらゆら動かす）
const tail = []; let parent = body;
for (let i = 0; i < 10; i++) {
  const seg = new THREE.Group();
  if (i === 0) seg.position.set(0.35, 0.35, -0.95); else seg.position.set(0, 0.2, 0);
  parent.add(seg);
  mesh(new THREE.CapsuleGeometry(0.1 - i * 0.004, 0.14, 6, 16), fur, seg, [0, 0.1, 0]);
  tail.push(seg); parent = seg;
}

// 頭
const head = new THREE.Group(); head.position.set(0, 2.32, 0.2); body.add(head);
mesh(sph(), fur, head, [0, 0, 0], [0.66, 0.58, 0.58]);
mesh(sph(), fur, head, [-0.3, -0.14, 0.12], [0.3, 0.26, 0.3]);      // ほっぺ
mesh(sph(), fur, head, [0.3, -0.14, 0.12], [0.3, 0.26, 0.3]);
mesh(sph(), furLight, head, [-0.1, -0.17, 0.48], [0.12, 0.1, 0.1]);  // マズル
mesh(sph(), furLight, head, [0.1, -0.17, 0.48], [0.12, 0.1, 0.1]);
mesh(sph(), pink, head, [0, -0.06, 0.57], [0.065, 0.045, 0.04]);       // 鼻
// 耳
const earGeo = new THREE.ConeGeometry(0.27, 0.6, 4, 1);
for (const s of [-1, 1]) {
  const ear = new THREE.Group(); ear.position.set(0.38 * s, 0.5, -0.04); ear.rotation.set(-0.1, 0, -0.32 * s); head.add(ear);
  mesh(earGeo, fur, ear, [0, 0, 0], [1, 1, 0.5], [0, Math.PI / 4, 0]);
  mesh(earGeo, pink, ear, [0, -0.03, 0.06], [0.6, 0.75, 0.2], [0, Math.PI / 4, 0]);
}
// 目（光る黄色＋縦長の瞳）
const eyes = [];
for (const s of [-1, 1]) {
  const e = new THREE.Group(); e.position.set(0.23 * s, 0.08, 0.5); e.rotation.y = 0.3 * s; head.add(e);
  mesh(sph(1, 32), eyeMat, e, [0, 0, 0], [0.13, 0.115, 0.07]);
  const pupil = mesh(sph(1, 24), pupilMat, e, [0, 0, 0.045], [0.025, 0.095, 0.035]);
  mesh(sph(1, 12), whiteMat, e, [0.04 * s, 0.045, 0.07], [0.02, 0.02, 0.01]);
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex(), color: 0xffaa00, transparent: true,
    blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.55 }));
  glow.scale.set(0.55, 0.55, 1); glow.position.z = 0.05; e.add(glow);
  eyes.push({ e, pupil, glow });
}
// 口（あごを開く）と舌
const jaw = new THREE.Group(); jaw.position.set(0, -0.27, 0.46); head.add(jaw);
const mouth = mesh(sph(1, 24), mouthMat, jaw, [0, 0, 0.04], [0.1, 0.02, 0.06]);
const tongue = mesh(new THREE.CapsuleGeometry(0.06, 0.12, 6, 16), pink, jaw, [0, -0.02, 0.05], [1, 1, 0.5], [Math.PI / 2, 0, 0]);
// ひげ
for (const s of [-1, 1]) for (const k of [-1, 0, 1]) {
  const g = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0.2 * s, -0.16 + k * 0.04, 0.5),
    new THREE.Vector3(0.78 * s, -0.12 + k * 0.1, 0.36)]);
  head.add(new THREE.Line(g, whiskerMat));
}
// 足もとの影
const shadowPlane = new THREE.Mesh(new THREE.PlaneGeometry(6, 6), new THREE.ShadowMaterial({ opacity: 0.4 }));
shadowPlane.rotation.x = -Math.PI / 2; shadowPlane.receiveShadow = true; scene.add(shadowPlane);

function glowTex() {
  const c = document.createElement("canvas"); c.width = c.height = 64;
  const g = c.getContext("2d"), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, "rgba(255,255,255,1)"); gr.addColorStop(0.3, "rgba(255,200,80,0.5)"); gr.addColorStop(1, "rgba(255,150,0,0)");
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}

// ---------------- 動き
const ease = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x));
function blinkAt(t) { const p = t % 3.7; return p < 0.12 ? Math.sin((p / 0.12) * Math.PI) : 0; }

/**
 * action: intro（暗闇から現れてこちらを見る）/ talk（しゃべる）/ purr（ゴロゴロ）/ lick（前足をなめる）/ outro（去っていく）
 * t: シーンの頭からの秒数, T: シーンの長さ, mouthOpen: 0〜1（声に合わせた口の開き）
 */
window.renderFrame = (action, t, T, mouthOpen) => {
  // 毎コマ初期姿勢に戻す
  cat.position.set(0, 0, 0); cat.rotation.set(0, 0, 0); body.position.set(0, 0, 0); body.rotation.set(0, 0, 0);
  head.rotation.set(0, 0, 0); legR.rotation.set(0, 0, 0); legL.rotation.set(0, 0, 0);
  let squint = 0, eyeGlow = 1, open = mouthOpen, tongueOut = 0, light = 1;

  const breathe = Math.sin(t * 2.2) * 0.012;
  body.scale.set(1 + breathe, 1 + breathe * 0.6, 1 + breathe);
  head.rotation.z = Math.sin(t * 0.9) * 0.05;
  head.rotation.y = Math.sin(t * 0.6) * 0.08;
  tail.forEach((s, i) => { s.rotation.z = Math.sin(t * 2.0 - i * 0.45) * 0.16; s.rotation.x = -0.18 + Math.sin(t * 1.3 - i * 0.3) * 0.05; });

  let camDist = 7.4, camY = 2.0, lookY = 1.55, orbit = Math.sin(t * 0.25) * 0.12;
  if (action === "intro") {
    const k = ease(t / 1.6);
    light = 0.15 + 0.85 * k;                  // 暗闇から浮かび上がる
    head.rotation.y = (1 - ease((t - 0.8) / 0.9)) * 0.9 + Math.sin(t * 0.6) * 0.05; // 横を向いていて、ゆっくりこちらを見る
    eyeGlow = 0.4 + 1.4 * ease((t - 1.4) / 0.4) - 0.4 * ease((t - 2.2) / 0.6); // こっちを見た瞬間に目がギラッ
    camDist = 8.6 - 1.6 * ease(t / Math.max(T, 0.1));
    squint = 0.35;
  } else if (action === "talk") {
    head.rotation.x = -0.06 - open * 0.08;
    head.position.y = 2.32 + open * 0.02;
    camDist = 7.0 - 0.6 * ease(t / T); camY = 2.1; lookY = 1.6;
    squint = 0.25;
  } else if (action === "purr") {
    const v = Math.sin(t * 60) * 0.006;       // ゴロゴロの細かい振動
    body.position.x = v; head.rotation.x = 0.12; squint = 0.75 + Math.sin(t * 1.5) * 0.1;
    head.rotation.z = 0.18 + Math.sin(t * 0.8) * 0.05;
    camDist = 6.8; lookY = 1.6;
  } else if (action === "lick") {
    const lift = ease(t / 0.6);
    legR.rotation.x = -2.05 * lift; legR.rotation.z = -0.5 * lift;
    head.rotation.x = 0.28 * lift; head.rotation.y = -0.35 * lift;
    const lk = Math.max(0, Math.sin(t * 7)) * lift;
    tongueOut = lk; open = Math.max(open * 0.6, lk * 0.5); squint = 0.7 * lift;
    camDist = 6.8; lookY = 1.65; orbit = -0.25;
  } else if (action === "outro") {
    const k = ease((t - Math.max(0, T - 2.0)) / 1.6);
    cat.rotation.y = Math.PI * 0.85 * k;      // 最後に背を向けて
    cat.position.z = -2.5 * k;                // 闇に去っていく
    light = 1 - 0.85 * k;
    eyeGlow = 1.2 * (1 - k);
    camDist = 7.0; squint = 0.3;
  }

  // 目
  const b = blinkAt(t + 0.7);
  for (const { e, glow, pupil } of eyes) {
    const c = Math.min(1, Math.max(squint, b));
    e.scale.y = 1 - c * 0.85;  // 目を細める・まばたき
    glow.material.opacity = 0.55 * eyeGlow * (1 - c * 0.8);
    pupil.scale.x = 0.025 + (action === "intro" ? 0.02 * (1 - ease((t - 1.4) / 0.3)) : 0);
  }
  eyeMat.emissiveIntensity = 1.6 * eyeGlow;
  // 口
  jaw.rotation.x = open * 0.35;
  mouth.scale.set(0.1 + open * 0.02, 0.02 + open * 0.07, 0.06);
  mouth.position.y = -open * 0.04;
  tongue.position.z = 0.02 + tongueOut * 0.14; tongue.position.y = -0.03 - open * 0.03;
  tongue.visible = tongueOut > 0.02 || open > 0.5;

  // 明るさ
  key.intensity = 60 * light; rimL.intensity = 40 * (0.5 + 0.5 * light); rimR.intensity = 30 * (0.5 + 0.5 * light);
  under.intensity = 4 * light;

  camera.position.set(Math.sin(orbit) * camDist, camY, Math.cos(orbit) * camDist);
  camera.lookAt(0, lookY, 0);
  renderer.render(scene, camera);
  return true;
};
window.ready = true;
</script>
</body>
</html>
